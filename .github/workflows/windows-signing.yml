name: Prepare signed Windows candidate

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: windows-signing-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sign:
    if: github.repository == 'seiejouke/cyber_atlas' && github.ref == 'refs/heads/main'
    runs-on: windows-2022
    environment: windows-signing
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: "1"
      WINDOWS_SIGNING_CERT_SHA256: ${{ vars.WINDOWS_SIGNING_CERT_SHA256 }}
    steps:
      - name: Check manual service setup
        shell: pwsh
        env:
          SIGNPATH_READY: ${{ vars.SIGNPATH_READY }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        run: |
          if ($env:SIGNPATH_READY -cne 'true') { throw 'Complete docs/SIGNPATH_SETUP.md before requesting a signed candidate.' }
          foreach ($name in @('SIGNPATH_ORGANIZATION_ID', 'SIGNPATH_PROJECT_SLUG', 'SIGNPATH_API_TOKEN')) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) { throw "Missing signing configuration: $name" }
          }
          if ($env:WINDOWS_SIGNING_CERT_SHA256 -notmatch '^[0-9A-Fa-f]{64}$') { throw 'Configure the approved certificate SHA-256 fingerprint.' }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12.3"
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
      - name: Check signing tools
        run: python tools/sign_windows.py preflight
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Read PE product version
        id: version
        shell: pwsh
        run: python -c "from atlas import __version__; print('version=' + __version__ + '.0')" >> $env:GITHUB_OUTPUT
      - name: Build application and prepare uninstaller
        run: python tools/sign_windows.py prepare --defer-desktop-checks
      - name: Upload application signing inputs
        id: inputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-signing-inputs
          path: build/windows/signpath/inputs/*
          if-no-files-found: error
          retention-days: 7
      - name: Request application and uninstaller signatures
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: release-signing
          artifact-configuration-slug: windows-inputs-v1
          github-artifact-id: ${{ steps.inputs.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1200
          output-artifact-directory: build/windows/signpath/signed-inputs
          parameters: |
            version: "${{ steps.version.outputs.version }}"
      - name: Verify signatures and assemble installer
        run: python tools/sign_windows.py assemble --signed-directory build/windows/signpath/signed-inputs
      - name: Upload installer signing input
        id: installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-installer-signing-input
          path: build/windows/signpath/installer-input/*.exe
          if-no-files-found: error
          retention-days: 7
      - name: Request installer signature
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: release-signing
          artifact-configuration-slug: windows-installer-v1
          github-artifact-id: ${{ steps.installer.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1200
          output-artifact-directory: build/windows/signpath/signed-installer
          parameters: |
            version: "${{ steps.version.outputs.version }}"
      - name: Verify all signatures and archive candidate
        run: python tools/sign_windows.py finalize --signed-directory build/windows/signpath/signed-installer --defer-desktop-checks
      - name: Keep signed candidate and verification report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cyber-atlas-windows-signed-candidate
          path: |
            dist/CyberAtlas-*-Setup.exe
            dist/CyberAtlas-*-windows-x64.zip
            dist/SHA256SUMS.txt
            dist/windows-signing-report.json
          if-no-files-found: error
          retention-days: 14
