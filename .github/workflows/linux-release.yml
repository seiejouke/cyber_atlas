name: Build Linux packages

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      LIBGL_ALWAYS_SOFTWARE: "1"
      GALLIUM_DRIVER: llvmpipe
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12.3"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
      - name: Install Linux graphics and packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb xauth libgl1-mesa-dri libglx-mesa0 libglu1-mesa libxrender1 libxft2 libxss1 desktop-file-utils squashfs-tools patchelf libfuse2
      - name: Install Python build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Build and test Debian package and AppImage
        run: xvfb-run -a -s "-screen 0 1440x1000x24" python tools/build_linux.py --test-install
      - name: Keep packages and test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cyber-atlas-linux-x86_64
          path: dist/linux/*
          if-no-files-found: warn
          retention-days: 14
