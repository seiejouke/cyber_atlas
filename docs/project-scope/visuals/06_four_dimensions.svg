<text x="44" y="65" font-family="DejaVu Sans, Arial, sans-serif" font-size="31" font-weight="700" fill="#F1F6FA" text-anchor="start">06  /  Four complementary dimensions</text>
<text x="46" y="96" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="400" fill="#A1B5C9" text-anchor="start">The atlas communicates place, accumulation, understanding, and change.</text>
<text x="1148" y="53" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#7492AB" text-anchor="end">FIG 06</text>
<rect x="70" y="153" width="503" height="183" rx="15" fill="#142235" stroke="#31475D" stroke-width="1"/>
<rect x="70" y="153" width="8" height="183" rx="6" fill="#71C4D9"/>
<text x="100" y="199" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" fill="#71C4D9" text-anchor="start">SPACE</text>
<text x="100" y="247" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700" fill="#F1F6FA" text-anchor="start">Where does this belong?</text>
<text x="100" y="291" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="400" fill="#A1B5C9" text-anchor="start">A stable, navigable location.</text>
<rect x="628" y="153" width="503" height="183" rx="15" fill="#142235" stroke="#31475D" stroke-width="1"/>
<rect x="628" y="153" width="8" height="183" rx="6" fill="#6BBCAF"/>
<text x="658" y="199" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" fill="#6BBCAF" text-anchor="start">VOLUME</text>
<text x="658" y="247" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700" fill="#F1F6FA" text-anchor="start">How much have I accumulated?</text>
<text x="658" y="291" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="400" fill="#A1B5C9" text-anchor="start">The relative extent of information.</text>
<rect x="70" y="374" width="503" height="183" rx="15" fill="#142235" stroke="#31475D" stroke-width="1"/>
<rect x="70" y="374" width="8" height="183" rx="6" fill="#B9A0E9"/>
<text x="100" y="420" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" fill="#B9A0E9" text-anchor="start">MASTERY</text>
<text x="100" y="468" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700" fill="#F1F6FA" text-anchor="start">How well can I explain or apply it?</text>
<text x="100" y="512" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="400" fill="#A1B5C9" text-anchor="start">Assessment-based understanding.</text>
<rect x="628" y="374" width="503" height="183" rx="15" fill="#142235" stroke="#31475D" stroke-width="1"/>
<rect x="628" y="374" width="8" height="183" rx="6" fill="#E9BC73"/>
<text x="658" y="420" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" fill="#E9BC73" text-anchor="start">TIME</text>
<text x="658" y="468" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700" fill="#F1F6FA" text-anchor="start">How has my knowledge evolved?</text>
<text x="658" y="512" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="400" fill="#A1B5C9" text-anchor="start">Historical growth and restructuring.</text>
